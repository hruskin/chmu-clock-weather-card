name: Release

# Push tagu vX.Y.Z -> build + GitHub Release s dist souborem (pro HACS)
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: Create release with asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/chmu-clock-weather-card.js
          generate_release_notes: true
