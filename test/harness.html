<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>chmu-alert-bar harness</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f2f4f8; margin: 2rem; }
  .card { max-width: 420px; background: white; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  :root {
    --primary-text-color: #1c1c1c;
    --secondary-text-color: #6b7280;
  }
  h1 { font-size: 1rem; color: #444; }
</style>
</head>
<body>
<h1>Harness: chmu-alert-bar (stub ha-icon / ha-dialog)</h1>
<div class="card">
  <chmu-alert-bar id="bar"></chmu-alert-bar>
  <div style="color:#888; font-size:.9rem">… tady by pokračovala clock-weather-card …</div>
</div>

<h1 style="margin-top:2rem">Varianta chips (compact řádek)</h1>
<div class="card">
  <div style="display:flex; align-items:center; gap:1rem">
    <div style="font-size:3rem; line-height:1.15">18:24</div>
    <div style="font-size:3rem">☁️</div>
    <div style="font-size:3rem; line-height:1.15">24,8°</div>
    <chmu-alert-bar id="chips" variant="chips"></chmu-alert-bar>
  </div>
</div>

<h1 style="margin-top:2rem">Skutečná karta (compact: true)</h1>
<div class="card" id="realcard-wrap" style="max-width:420px">
  <chmu-clock-weather-card id="realcard"></chmu-clock-weather-card>
</div>

<script>
  // Stubs za HA frontend elementy (v harness nejsou k dispozici)
  customElements.define('ha-icon', class extends HTMLElement {
    set icon (v) { this._i = v; this.render() }
    get icon () { return this._i }
    static get observedAttributes () { return ['icon'] }
    attributeChangedCallback (n, o, v) { this._i = v; this.render() }
    render () {
      const map = {
        'mdi:sun-thermometer': '🌡️', 'mdi:weather-lightning': '⛈️',
        'mdi:chevron-right': '›', 'mdi:alert': '⚠️'
      }
      this.textContent = map[this._i] ?? '●'
    }
  })
  customElements.define('ha-dialog', class extends HTMLElement {
    connectedCallback () {
      this.style.cssText = 'display:block;position:fixed;inset:10% 20%;background:white;border:2px solid #888;border-radius:12px;padding:1rem;overflow:auto;z-index:10;box-shadow:0 8px 40px rgba(0,0,0,.35)'
      const h = document.createElement('div')
      h.textContent = this.heading ?? this.getAttribute('heading') ?? ''
      h.style.cssText = 'font-weight:700;font-size:1.1rem;margin-bottom:.75rem'
      this.prepend(h)
      const close = document.createElement('button')
      close.textContent = 'Zavřít (stub)'
      close.onclick = () => this.dispatchEvent(new CustomEvent('closed'))
      this.append(close)
    }
  })
</script>
<script type="module">
  import '../dist/chmu-clock-weather-card.js'

  const attrs = {
    alert_count: 2,
    severity: 'Moderate',
    color: 'orange',
    headline: 'Zátěž teplem · Bouřky',
    alert_icon: 'mdi:sun-thermometer',
    area: 'Středočeský kraj',
    orp: 'Říčany',
    alerts: [
      {
        label: 'Zátěž teplem', icon: 'mdi:sun-thermometer', severity: 'Moderate',
        description: 'Očekáváme silnou zátěž teplem. Riziko přehřátí a dehydratace.',
        instruction: 'Držet se ve stínu, dodržovat pitný režim.',
        start: '2026-07-17T08:53:33+00:00', end: '2026-07-17T17:00:00+00:00'
      },
      {
        label: 'Bouřky', icon: 'mdi:weather-lightning', severity: 'Severe',
        description: 'Riziko silných bouřek s přívalovým deštěm kolem 40 mm.',
        instruction: 'Nezdržovat se pod stromy.',
        start: '2026-07-17T11:00:00+00:00', end: '2026-07-17T22:00:00+00:00'
      }
    ]
  }

  const hass = { states: { 'binary_sensor.test': { state: 'on', attributes: attrs } } }
  for (const id of ['bar', 'chips']) {
    const el = document.getElementById(id)
    el.hass = hass
    el.entityId = 'binary_sensor.test'
    el.locale = 'cs'
  }

  // --- skutečná karta se stubovaným hass ---
  const day = 24 * 3600 * 1000
  const forecast = [0, 1, 2, 3, 4].map(i => ({
    datetime: new Date(Date.now() + i * day).toISOString(),
    condition: ['rainy', 'cloudy', 'rainy', 'sunny', 'cloudy'][i],
    temperature: [27, 23, 19, 20, 18][i],
    templow: [17, 15, 11, 11, 11][i],
    precipitation: [2, 1, 3, 0, 0][i],
    precipitation_probability: [80, 40, 90, 5, 10][i]
  }))
  const cardHass = {
    locale: { language: 'cs', time_format: '24' },
    config: { unit_system: { temperature: '°C' } },
    states: {
      'weather.test': {
        entity_id: 'weather.test',
        state: 'rainy',
        attributes: {
          temperature: 24.8,
          temperature_unit: '°C',
          humidity: 63,
          precipitation_unit: 'mm',
          supported_features: 1
        }
      },
      'binary_sensor.test': { state: 'on', attributes: attrs }
    },
    connection: {
      subscribeMessage: async (cb, _msg) => {
        setTimeout(() => cb({ type: 'daily', forecast }), 50)
        return async () => {}
      }
    }
  }
  const card = document.getElementById('realcard')
  card.setConfig({
    entity: 'weather.test',
    alert_entity: 'binary_sensor.test',
    compact: true,
    locale: 'cs',
    forecast_rows: 5
  })
  card.hass = cardHass
</script>
</body>
</html>
